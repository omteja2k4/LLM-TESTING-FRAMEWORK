name: LLM QA regression checks
on:
  push:
  pull_request:

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and testing tools
        run: python -m pip install -e '.[dev]'
      - name: Run deterministic regression tests
        run: python -m pytest -m 'not live' --cov=ai_quality --cov-report=term-missing
      - name: Generate example evaluation report
        run: llm-qa --provider fixture --output reports/evaluation.json
      - name: Upload JSON report
        uses: actions/upload-artifact@v4
        with:
          name: llm-qa-offline-report
          path: reports/evaluation.json
